[workspace]
resolver = "2"
members = [
    "crates/nodikle-model",
    "crates/nodikle-core",
    "crates/nodikle-storage",
    "crates/nodikle-index",
    "apps/app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async Runtime & Utilities
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
blake3 = "1.5"
regex = "1.11"
pulldown-cmark = "0.12"
tempfile = "3.13"

# Storage & Index
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7.0"

# Desktop & Mobile Host
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Internal Crates
nodikle-model = { path = "crates/nodikle-model" }
nodikle-core = { path = "crates/nodikle-core" }
nodikle-storage = { path = "crates/nodikle-storage" }
nodikle-index = { path = "crates/nodikle-index" }
